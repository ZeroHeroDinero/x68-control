<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
  <title>X68 Control</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <div class="brand-name">X68 Control</div>
          <div class="brand-sub" id="deviceLine">Not connected</div>
        </div>
      </div>
      <div class="devswitch" id="devSwitch" role="tablist" aria-label="Device">
        <button data-dev="keyboard" class="on" role="tab"><span class="dot" id="kbDot"></span>Keyboard</button>
        <button data-dev="mouse" role="tab"><span class="dot" id="msDot"></span>Mouse</button>
      </div>
      <nav class="nav" id="nav">
        <button data-view="actuation" class="active"><span class="ico ico-depth"></span>Actuation</button>
        <button data-view="advanced"><span class="ico ico-adv"></span>Advanced keys</button>
        <button data-view="remap"><span class="ico ico-remap"></span>Remap keys</button>
        <button data-view="lighting"><span class="ico ico-light"></span>Lighting</button>
        <button data-view="macros"><span class="ico ico-macro"></span>Macros</button>
        <button data-view="settings"><span class="ico ico-gear"></span>Settings</button>
      </nav>
      <nav class="nav hidden" id="mouseNav">
        <button data-mview="dpi" class="active"><span class="ico ico-target"></span>DPI</button>
        <button data-mview="buttons"><span class="ico ico-mouse"></span>Buttons</button>
        <button data-mview="sensor"><span class="ico ico-sensor"></span>Sensor and polling</button>
        <button data-mview="mtest"><span class="ico ico-check"></span>Test</button>
        <button data-mview="mouseinfo"><span class="ico ico-gear"></span>Mouse settings</button>
      </nav>
      <div class="side-foot" id="sideFoot">
        <div class="profile-label">Profile</div>
        <div class="profiles" id="profiles">
          <button data-p="0">1</button><button data-p="1">2</button><button data-p="2">3</button><button data-p="3">4</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="update-bar hidden" id="updateBar"><span id="updateText"></span><span class="spacer"></span><button class="btn small primary" id="updateBtn">Restart and update</button></div>
      <section class="board-wrap" id="boardWrap">
        <div class="board-head">
          <div class="board-title" id="boardTitle">Pick keys to change</div>
          <div class="board-tools" id="boardTools"></div>
        </div>
        <div class="board" id="board"></div>
        <div class="board-legend" id="boardLegend"></div>
      </section>
      <section class="panel" id="panel"></section>
    </main>
  </div>

  <div class="overlay hidden" id="connectOverlay">
    <div class="connect-card">
      <div class="connect-art" aria-hidden="true"></div>
      <h1 id="connectTitle">Plug in your X68 HE</h1>
      <p id="connectText">Use the USB cable. The app finds the keyboard on its own once it is plugged in.</p>
      <div class="progress hidden" id="loadProgress"><div class="bar" id="loadBar"></div></div>
      <button class="btn primary" id="connectBtn">Connect keyboard</button>
      <p class="fine" id="connectFine">Close the official Attack Shark page or app first, two programs can't talk to the keyboard at once.</p>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>
  <div class="modal hidden" id="modal"><div class="modal-card" id="modalCard"></div></div>

  <script type="module" src="app.js"></script>
</body>
</html>
