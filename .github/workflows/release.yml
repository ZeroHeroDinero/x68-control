name: Build and release

# Bump "version" in package.json and push to main: GitHub builds the
# Windows installer and publishes it as a release. Installed apps pick it up.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Skip if this version is already released
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          if gh release view "v$v" >/dev/null 2>&1; then echo "skip=true" >> $GITHUB_OUTPUT; else echo "skip=false" >> $GITHUB_OUTPUT; fi
      - run: npm ci
        if: steps.check.outputs.skip == 'false'
      - name: Build installer
        if: steps.check.outputs.skip == 'false'
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Publish release
        if: steps.check.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          gh release create "v$v" --target "$GITHUB_SHA" --title "X68 Control $v" --notes "Download X68-Control-Setup-$v.exe and run it. Already installed? The app updates itself." dist/X68-Control-Setup-$v.exe dist/X68-Control-Setup-$v.exe.blockmap dist/latest.yml
